name: UI Screenshots

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[test]"
          playwright install chromium --with-deps

      - name: Run screenshot tests
        run: pytest tests/test_screenshots.py -v

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots/
          git diff --cached --quiet || git commit -m "Update UI screenshots"
          git push

      - name: Post screenshot to PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr view --json number -q '.number')
          RAW_URL="${{ github.server_url }}/${{ github.repository }}/raw/${{ github.head_ref }}/screenshots/index.png"
          gh pr comment "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --body "## UI Screenshots

          ![Index page](${RAW_URL})

          | Page | Screenshot |
          |------|------------|
          | Index | [index.png](${RAW_URL}) |
          | Deals | [deals.png](${{ github.server_url }}/${{ github.repository }}/raw/${{ github.head_ref }}/screenshots/deals.png) |
          | Games | [games.png](${{ github.server_url }}/${{ github.repository }}/raw/${{ github.head_ref }}/screenshots/games.png) |
          | Game Detail | [game_detail.png](${{ github.server_url }}/${{ github.repository }}/raw/${{ github.head_ref }}/screenshots/game_detail.png) |"
