{% extends "base.html" %}
{% block title %}eShop Deals{% endblock %}
{% block content %}
<h1>Top Deals</h1>
<div class="grid">
    {% for deal in deals %}
    <a href="/games/{{ deal.id }}" class="card" style="text-decoration:none;color:inherit">
        <img src="{{ deal.image_url }}" alt="{{ deal.title }}" loading="lazy">
        <div class="card-body">
            <h3>{{ deal.title }}</h3>
            <div class="meta">{{ deal.publisher }}</div>
            <div class="price">
                <span class="sale">${{ "%.2f"|format(deal.sale_price) }}</span>
                <span class="reg">${{ "%.2f"|format(deal.reg_price) }}</span>
                <span class="badge">-{{ deal.discount_pct }}%</span>
            </div>
        </div>
    </a>
    {% endfor %}
</div>
{% endblock %}
